# 实验3：时间跨度感知 APN 三元组损失
# 基于基准模型（ResNet101 + 80epoch预训练权重）
# 对比实验：测试新的时间APN策略

data:
  root_dir: "/workspace/turtlehead-dataset/Turtel_dataset"
  splits_dir: "dataset_splits"
  dataset_name: "dataset_D_ge3years_count"
  train_json: "train.json"
  test_json: "test.json"
  image_size: 224
  num_workers: 4
  min_samples_per_identity: 5  # 保持5，保留所有个体

model:
  backbone: resnet101
  pretrained: true
  bottleneck_dim: 512
  use_mlp_bottleneck: true
  dropout: 0.4
  arcface_s: 30.0
  arcface_m: 0.35
  use_se_block: false
  label_smoothing: 0.1

training:
  batch_size: 64
  accumulation_steps: 1
  epochs: 120
  freeze_until_epoch: 0
  optimizer: Adam
  base_lr: 0.0001
  backbone_lr: 0.00001
  weight_decay: 0.0005
  scheduler: CosineAnnealingLR
  eta_min: 0.000001
  precision: 16
  
  # === 三元组损失配置（实验3：时间APN）===
  triplet_weight: 0.2
  triplet_margin: 0.3
  triplet_start_epoch: 0
  triplet_warmup_epochs: 10
  
  # 损失函数选择（互斥）
  use_time_weighted_triplet: false
  use_temporal_apn_triplet: true
  
  # 时间加权相关参数（本次实验不使用）
  time_alpha: 0.3
  max_time_gap: 10.0
  
  checkpoint_dir: "checkpoints_exp3_temporal_apn"
  log_interval: 10

augmentation:
  random_horizontal_flip: 0.5
  random_affine_degrees: 15
  color_jitter_brightness: 0.3
  color_jitter_contrast: 0.3
  color_jitter_saturation: 0.2
  color_jitter_hue: 0.1
  gaussian_blur_kernel: 3
  gaussian_blur_sigma: [0.1, 2.0]
  random_erasing_p: 0.5
  random_erasing_scale: [0.02, 0.15]
  random_erasing_ratio: [0.3, 3.3]
