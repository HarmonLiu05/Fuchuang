# Baseline实验：只用交叉熵损失（无三元组损失）
# 过滤条件：min_samples_per_identity=15（72个个体）
# 目的：作为时间APN和距离三元组的对照基准

data:
  root_dir: "/workspace/turtlehead-dataset/Turtel_dataset"
  splits_dir: "dataset_splits"
  dataset_name: "dataset_D_ge3years_count"
  train_json: "train.json"
  test_json: "test.json"
  image_size: 224
  num_workers: 4
  min_samples_per_identity: 15  # 过滤到72个个体

model:
  backbone: resnet101
  pretrained: true            # 用ImageNet预训练（推荐）
  bottleneck_dim: 512
  use_mlp_bottleneck: true
  dropout: 0.4
  arcface_s: 30.0
  arcface_m: 0.35
  use_se_block: false
  label_smoothing: 0.1

training:
  batch_size: 64
  accumulation_steps: 1
  epochs: 80                 # 纯交叉熵不需要跑太久，80epoch足够收敛
  freeze_until_epoch: 0
  optimizer: Adam
  base_lr: 0.001
  backbone_lr: 0.0001
  weight_decay: 0.0005
  scheduler: CosineAnnealingLR
  eta_min: 0.000001
  precision: 16
  
  # === 关闭所有三元组损失 ===
  triplet_weight: 0.0          # 三元组权重设为0
  triplet_margin: 0.3
  triplet_start_epoch: 999     # 永远不会启用
  triplet_warmup_epochs: 0
  
  use_time_weighted_triplet: false
  use_temporal_apn_triplet: false
  
  checkpoint_dir: "/workspace/experiments-checkpoints/baseline_ce_only"
  log_interval: 10

augmentation:
  random_horizontal_flip: 0.5
  random_affine_degrees: 15
  color_jitter_brightness: 0.3
  color_jitter_contrast: 0.3
  color_jitter_saturation: 0.2
  color_jitter_hue: 0.1
  gaussian_blur_kernel: 3
  gaussian_blur_sigma: [0.1, 2.0]
  random_erasing_p: 0.5
  random_erasing_scale: [0.02, 0.15]
  random_erasing_ratio: [0.3, 3.3]
