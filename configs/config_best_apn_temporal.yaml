# APN 时间损失极限测试
# 使用 TimeAwareBatchSampler 保证每个 Batch 内同个体有 4 张照片
# 目的：测试 APN 时间损失的最佳效果

data:
  root_dir: "/workspace/turtlehead-dataset/Turtel_dataset"
  splits_dir: "dataset_splits"
  dataset_name: "dataset_D_ge3years_count"
  train_json: "train.json"
  test_json: "test.json"
  image_size: 224
  num_workers: 8  # 从 4 调到 8，加速数据加载
  min_samples_per_identity: 15  # 过滤到 72 个个体

model:
  backbone: resnet101
  pretrained: true
  bottleneck_dim: 512
  use_mlp_bottleneck: true
  dropout: 0.4
  arcface_s: 30.0
  arcface_m: 0.35
  use_se_block: false
  label_smoothing: 0.1

training:
  batch_size: 64
  accumulation_steps: 1
  epochs: 200              # 增加 Epoch 数（弥补每 epoch batch 少的问题）
  freeze_until_epoch: 1    # 第1个epoch结束后立即解冻，避免全程冻结
  optimizer: Adam
  base_lr: 0.001           # 修正：对齐距离三元组，公平对比！
  backbone_lr: 0.0001      # 修正：对齐距离三元组
  weight_decay: 0.0005
  scheduler: CosineAnnealingLR
  eta_min: 0.000001
  precision: 16
  
  # === 开启时间 APN 三元组 ===
  triplet_weight: 0.2
  triplet_margin: 0.3
  triplet_start_epoch: 0
  triplet_warmup_epochs: 10
  
  use_time_weighted_triplet: false
  use_temporal_apn_triplet: true  # 必须为 true
  
  # 数据加载策略：
  # true: TimeAwareBatchSampler (每个batch同个体有4张，纯时间选择，但每epoch只有4-5个迭代)
  # false: 普通 Shuffle (每epoch 35个迭代，训练快。找不到时间样本时自动退化为距离三元组)
  use_time_aware_sampler: false
  
  # 时间加权相关参数
  time_alpha: 0.3
  max_time_gap: 10.0
  
  checkpoint_dir: "/workspace/experiments-checkpoints/best_apn_temporal"
  log_interval: 10

augmentation:
  random_horizontal_flip: 0.5
  random_affine_degrees: 15
  color_jitter_brightness: 0.3
  color_jitter_contrast: 0.3
  color_jitter_saturation: 0.2
  color_jitter_hue: 0.1
  gaussian_blur_kernel: 3
  gaussian_blur_sigma: [0.1, 2.0]
  random_erasing_p: 0.5
  random_erasing_scale: [0.02, 0.15]
  random_erasing_ratio: [0.3, 3.3]
